[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-widget"
version = "1.0.8"
description = "Jupyter widget that runs a cell in a fresh, isolated namespace (the %%exercise cell magic)"
authors = [
    {name = "Kasper Munch", email = "kaspermunch@birc.au.dk"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "anywidget>=0.11,<0.12",
    "traitlets>=5.0",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/munch-group/script-widget"
Repository = "https://github.com/munch-group/script-widget"
Documentation = "https://munch-group.org/script-widget"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]

[tool.setuptools.package-data]
sandbox_widget = ["data/*.txt", "data/*.csv", "data/*.pickle", "data/*.h5"]

[tool.pixi.workspace]
channels = ["conda-forge", "munch-group"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.9,<3.14"
pytest = "*"
jupyter = "*"
quarto = ">=1.9.38,<2"
quartodoc = ">=0.11.1,<0.12"
# quartodoc 0.11.1's conda-forge package declares an unbounded "griffe>=0.33"
# runtime dependency, but hardcodes a numpy-docstring parser option
# ("allow_section_blank_line") that griffe 2.x removed from parse_numpy()'s
# signature -- an upstream packaging gap (missing "<2" cap), not a
# sandbox-widget bug. Pin griffe below 2 here until quartodoc/conda-forge
# fixes their own bound (see puzzle-widget's pyproject.toml for the same pin).
griffe = "<2"
nbconvert = "*"
pip = ">=25.2,<26"
nodejs = ">=20,<23"
ipython = "*"
# Required by scripts/git-commit.sh: nbdime for semantic notebook diffs
# (hard-required, script exits if missing), jq for parsing the Anthropic
# API response used to draft commit messages. jq has no conda-forge build for
# win-64, so it's declared per-target below instead of here.
nbdime = "*"
anywidget = ">=0.11.0,<0.12"
# Dev/test only (not a sandbox_widget runtime dependency) -- exercises the
# %%exercise -> matplotlib figure capture path in test/test_executor.py.
matplotlib-base = "*"

# [tool.pixi.pypi-dependencies]
# sandbox-widget = { path = ".", editable = true }

[tool.pixi.target.osx-arm64.dependencies]
jq = "*"

[tool.pixi.target.osx-64.dependencies]
jq = "*"

[tool.pixi.target.linux-64.dependencies]
jq = "*"

[tool.pixi.environments]
default = {solve-group = "default"}

[tool.pixi.tasks.init]
cmd = "python ./scripts/rename.py && gh repo set-default https://github.com/munch-group/$(basename $(git rev-parse --show-toplevel)) && git add src && git add -u"

[tool.pixi.tasks.install-dev]
cmd = "pip install --no-build-isolation --force-reinstall --no-deps ."
description = "Development install"

[tool.pixi.tasks.notebook]
args = [ { "arg" = "notebook" } ]
cmd = "jupyter nbconvert --log-level=WARN --to notebook --execute --inplace --TagRemovePreprocessor.enabled=True --TagRemovePreprocessor.remove_cell_tags='{\"skip-execution\"}' {{ notebook }}"

[tool.pixi.tasks.api]
cmd = "./scripts/docs-build-render.sh"
description = "Build quartodoc api doc pages"

[tool.pixi.tasks.docs]
cmd = "./scripts/docs-run-notebooks.sh"
description = "Execute documentation notebooks in-place"

[tool.pixi.tasks.clean]
cmd = "git clean -id"
description = "Removes untracked files and directories but respects your .gitignores"

[tool.pixi.tasks.test]
cmd = "pytest test/"
description = "Run the pytest suite"

[tool.pixi.tasks.commit]
cmd = "./scripts/git-commit.sh"

[tool.pixi.tasks.bump]
args = [
  { "arg" = "kind", "default" = "patch" },  # can be patch, minor, major
  { "arg" = "flag", "default" = "" },     # can be --pre, --release
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump'"

[tool.pixi.tasks.release]
args = [
  { "arg" = "kind", "default" = "patch" },  # can be patch, minor, major
  { "arg" = "flag", "default" = "" },     # can be --pre, --release
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump' && git push && ./scripts/github-release.sh"
description = "Bump version patch and push tag to build/upload conda/pypi packages"

[tool.pixi.tasks.version]
args = [
  { "arg" = "kind", "default" = "patch" },  # can be patch, minor, major
  { "arg" = "flag", "default" = "" },     # can be --pre, --release
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump' && git push && ./scripts/github-release.sh"
depends-on = ["test", "api", "docs", "commit"]
description = "Bump version patch and push tag to build/upload conda/pypi packages"


[tool.pytest.ini_options]
testpaths = ["test"]
